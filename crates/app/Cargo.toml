[package]
name = "taro-app"
description = "Taro desktop application. Phase 3: animated, themed Celtic Cross reading (Bevy)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
taro-domain = { path = "../domain" }
rand = "0.8"
serde_json = "1"

# Claude "deeper reading" (Phase 5): blocking client on a worker thread — the
# response's Read impl streams SSE lines without needing a tokio runtime.
[dependencies.reqwest]
version = "0.12"
default-features = false
features = ["blocking", "rustls-tls"]

# OS secret store for the API key (`taro-app --set-api-key`): Secret Service
# (GNOME Keyring / KWallet) on Linux, native stores on Windows/macOS. The
# async-secret-service backend is pure Rust (zbus) — sync-secret-service would
# drag in libdbus C headers.
[dependencies.keyring]
version = "3"
features = ["async-secret-service", "async-io", "crypto-rust", "windows-native", "apple-native"]

# Curated Bevy feature set: a 2D sprite app on Linux/Wayland. We avoid the
# `2d`/`ui` umbrella and `default_platform` features because they pull in audio
# (alsa) and gamepad (udev) support, whose system libs aren't installed here.
[dependencies.bevy]
version = "0.18"
default-features = false
features = [
    "std",
    "default_app",      # bevy_asset, bevy_log, bevy_state, bevy_window, ...
    "multi_threaded",
    "bevy_winit",
    "wayland",
    "x11",
    "2d_bevy_render",   # bevy_render + core_pipeline + sprite render
    "ui_bevy_render",   # bevy_ui + UI render (scrollable overlay) — no audio/gamepad
    "bevy_sprite",
    "bevy_image",
    "png",
]
